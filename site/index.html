<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Study Hub</title>
  <meta name="description" content="Personal study hub: notes, flashcards, quizzes and formula sheets for Competitive Programming.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6fdf'/%3E%3Cpath d='M9 9h9a5 5 0 0 1 0 10h-5v5H9z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="vendor/katex/katex.min.css">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    // Apply saved theme before first paint to avoid a flash.
    try {
      var t = JSON.parse(localStorage.getItem('study:theme'));
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true">S</span>Study Hub</a>
      <form id="search-form" class="search" role="search">
        <input type="search" id="search-input" placeholder="Search notes & cards…" aria-label="Search notes and flashcards" autocomplete="off">
      </form>
      <div class="header-actions">
        <button id="theme-toggle" class="icon-btn" type="button" title="Toggle dark mode" aria-label="Toggle dark mode">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="site-footer">
    Add your own notes in <code>site/content/</code> — see the README for how.
  </footer>

  <script src="vendor/marked.min.js" defer></script>
  <script src="vendor/katex/katex.min.js" defer></script>
  <script src="vendor/katex/auto-render.min.js" defer></script>
  <script src="vendor/highlight.min.js" defer></script>
  <script src="assets/app.js" defer></script>
</body>
</html>
